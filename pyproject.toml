[project]
name = "sedstat"
version = "0.1.0"
description = "Grain size distribution analysis for laser granulometer and sieve/pipette lab data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dennis Handy", email = "dhandy1@uni-koeln.de" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandas>=2.1",
]

[project.scripts]
sedstat = "sedstat.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.16",
    "mypy>=1.10",
    "xenon>=0.9.1",
    "pre-commit>=3.7",
    "pandas-stubs>=2.1",
    "bandit>=1.7",
    "vulture>=2.11",
    "pylint>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sedstat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 flag ambiguous-looking unicode (Greek letters, µ, en/em dashes,
# arrows); this codebase uses them deliberately throughout for scientific
# notation (µm, φ, σ) and prose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "seaborn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
