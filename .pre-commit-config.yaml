repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy sedstat
        language: system
        types: [python]
        pass_filenames: false
      - id: xenon
        name: xenon (complexity gate)
        entry: uv run xenon --max-absolute B --max-modules B --max-average A sedstat
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit (security)
        entry: uv run bandit -r sedstat
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture sedstat tests --min-confidence 80
        language: system
        types: [python]
        pass_filenames: false
      - id: pylint-duplicate-code
        name: pylint (duplicate code)
        entry: uv run pylint --disable=all --enable=duplicate-code sedstat
        language: system
        types: [python]
        pass_filenames: false
